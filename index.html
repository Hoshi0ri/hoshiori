<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>正在启动 CS2…</title>
<style>
  body { background:#12121c; color:#e8e8f0; font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; text-align:center; }
  .box { padding:24px; max-width:420px; }
  a { color:#4fc3f7; word-break:break-all; }
  .hint { color:#8a90a8; font-size:13px; margin-top:14px; line-height:1.6; }
  .btn { display:inline-block; margin-top:10px; padding:10px 18px; border-radius:8px; background:#4fc3f7; color:#0b0b12; font-weight:600; text-decoration:none; }
</style>
</head>
<body>
<div class="box">
  <h2 id="title">正在启动 CS2…</h2>
  <p id="target"></p>
  <p><a id="btn" class="btn" href="#">点这里手动启动</a></p>
  <p class="hint">已安装 Steam 的话会自动打开游戏并连接服务器；如果没反应，点上面的按钮或复制下面的链接到浏览器打开。</p>
  <p><a id="raw" href="#"></a></p>
</div>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  var host = p.get('host') || p.get('ip') || '';
  var port = p.get('port') || '27015';
  if (!host) {
    document.getElementById('title').textContent = '缺少服务器地址';
    return;
  }
  // 与 darkrp.cn 相同的写法：rungame + 固定 client id + +connect，末尾带 /
  var url = 'steam://rungame/730/76561202255233023/+connect ' + host + ':' + port + '/';
  document.getElementById('target').textContent = '服务器：' + host + ':' + port;
  var btn = document.getElementById('btn');
  var raw = document.getElementById('raw');
  btn.href = url;
  raw.href = url;
  raw.textContent = url;
  setTimeout(function () { location.href = url; }, 150);
  setTimeout(function () {
    document.getElementById('title').textContent = '已启动 Steam';
    try { window.close(); } catch (e) {}
  }, 900);
})();
</script>
</body>
</html>
